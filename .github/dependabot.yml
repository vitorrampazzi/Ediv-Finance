version: 2
updates:
  - package-ecosystem: npm
    directory: /evorix-finance
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 3
